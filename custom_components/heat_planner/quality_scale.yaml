rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: Plans are recalculated every 5 minutes and on the hour; meters and presence are event driven.
  brands:
    status: done
    comment: Icon and logo (light and dark, 1x/2x) ship in custom_components/heat_planner/brand/, served by Home Assistant's brands API for custom integrations.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: exempt
    comment: No third-party requirements.
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: exempt
    comment: Nothing to connect to; the price source and entities are picked from what Home Assistant already has.
  test-before-setup: done
  unique-config-entry:
    status: exempt
    comment: Several homes (e.g. house and cabin) are supported on purpose, each with its own entry.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: No credentials; a repair issue points to the price integration (e.g. Tibber) when it needs re-authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Not a network device.
  discovery:
    status: exempt
    comment: Not a network device; thermostats are found inside the config and options flows.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default:
    status: done
    comment: No noisy entities; capacity-tariff sensors are only created when that feature is configured.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues: done
  stale-devices: done

  # Platinum
  async-dependency:
    status: exempt
    comment: No third-party library.
  inject-websession:
    status: exempt
    comment: No HTTP client of its own; prices come from other integrations' services and entities.
  strict-typing:
    status: todo
    comment: mypy strict passes except coordinator.py, planner.py and optimizer.py (see pyproject.toml overrides).
